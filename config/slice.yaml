# Описание среза данных. Этот файл определяет, какие данные считаются «нашими».
# Менять только вместе с пересчётом манифеста.

slice_id: ai-2010-2025

# ПРОБНЫЙ фильтр: выбран для замера объёма, командой не согласован.
# Таксономия OpenAlex: domain > field > subfield > topic. Берём уровень subfield —
# отдельных topic в ИИ около сотни, перечислять их вручную и поддерживать нечем.
direction:
  name: искусственный интеллект
  openalex_subfield_ids: [1702]   # Artificial Intelligence
  # 1707 Computer Vision — кандидат на расширение, +470 тыс. записей
  openalex_subfield_ids_candidate: [1707]

years:
  start: 2010
  end: 2025

filters:
  types: [article, preprint]
  require_abstract: true
  # Тематическая привязка у OpenAlex вероятностная: встречаются записи со score 0.05.
  # Порог пробный, подбирается по глазам на выборке.
  min_primary_topic_score: 0.5

fetch:
  per_page: 200
  max_retries: 5
  backoff_seconds: 2

paths:
  raw: data/raw
  aggregates: data/aggregates
  sample: data/sample
  manifest: data/manifest.json
